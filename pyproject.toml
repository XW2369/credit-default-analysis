[project]
name = "credit"
version = "0.1.0"
description = "Credit default analysis - Day 2 of a 7-day AI engineer bootcamp (EDA / SQL / WOE-IV feature engineering)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "xlrd>=2.0",
    "openpyxl>=3.1",
    "duckdb>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
